services:
  app:
    image: ghcr.io/arthurlovelin/arthurs-blog:latest
    container_name: arthurs-blog
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./.env.local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - nextjs_cache:/app/.next/cache
      - /home/arthur/.local/bin/agy:/home/arthur/.local/bin/agy:ro
      - /home/arthur/.gemini/antigravity-cli:/home/arthur/.gemini/antigravity-cli:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /home/arthur/repositories/arthurs-blog/ClaudeDesign/calorie/calorie-db.json:/home/arthur/repositories/arthurs-blog/ClaudeDesign/calorie/calorie-db.json:ro
      - /home/arthur/repositories/arthurs-blog/ClaudeDesign/calorie/instruction.md:/home/arthur/repositories/arthurs-blog/ClaudeDesign/calorie/instruction.md:ro
      - /tmp/arthurs-blog:/tmp/arthurs-blog
    networks:
      - default
      - 1panel-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  nextjs_cache:

networks:
  1panel-network:
    external: true

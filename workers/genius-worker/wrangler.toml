name = "genius-lyrics-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "GENIUS_CACHE"
id = "3f392ec87e8d405eab06101fcec62270"
preview_id = "3f392ec87e8d405eab06101fcec62270"

# Secrets (通过 wrangler secret put 设置):
# GENIUS_API_TOKEN       — Genius 免费 API token

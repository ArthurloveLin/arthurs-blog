name = "spotify-sync-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# Cron Triggers
# Example: 
# - "5 16 * * *" = 每天 16:05 (UTC) 运行 (北京时间 00:05) -> Full Sync
# - "*/10 * * * *" = 每 10 分钟运行一次 -> Quick Sync
[triggers]
crons = ["5 16 * * *", "*/10 * * * *"]

# R2 Bucket Binding
[[r2_buckets]]
binding = "SPOTIFY_BUCKET"
bucket_name = "spotify-data" # TODO: 修改为你的 R2 Bucket 名称

[vars]
R2_SPOTIFY_PUBLIC_DOMAIN = "music.arthurlovegrace.top" # TODO: 如果有配置公共域名
NEXTJS_SITE_URL = "https://arthurlovegrace.top" # TODO: 修改为你的网站主域名，用于刷新缓存

# 注意：需要通过命令行或 Dashboard 设置以下 Secrets
# npx wrangler secret put SPOTIFY_CLIENT_ID
# npx wrangler secret put SPOTIFY_CLIENT_SECRET
# npx wrangler secret put SPOTIFY_REFRESH_TOKEN
# npx wrangler secret put LASTFM_API_KEY
# npx wrangler secret put SPOTIFY_SYNC_SECRET (用于手动通过 URL 触发时的校验)

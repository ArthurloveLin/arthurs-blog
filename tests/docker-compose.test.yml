services:
  app-test:
    image: ghcr.io/arthurlovelin/arthurs-blog:latest
    container_name: arthurs-blog-test
    ports:
      - "127.0.0.1:3020:3000"
    env_file: ../.env.test.local
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/blog/search?q=test", "-o", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: "no"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true

[pytest]
asyncio_mode = auto
timeout = 30

# Custom markers
markers =
    smoke: fast critical path tests that run on every push
    admin: requires admin credentials (TEST_ADMIN_EMAIL + TEST_ADMIN_PASSWORD)
    write: creates/modifies data, requires cleanup fixture
    slow: tests that take >5s

# Default options
addopts =
    --tb=short
    --strict-markers
    --alluredir=allure-results

# Ignore non-test directories
testpaths = tests

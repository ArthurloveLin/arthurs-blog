# OpenResty / Nginx server block for test.arthurlovegrace.top
#
# This routes public traffic to the test container (port 3020 on VPS).
# Used by Locust performance tests running on GitHub Actions cloud runners.
#
# HOW TO APPLY (1Panel-managed OpenResty):
#   1Panel → Website → Add Site → test.arthurlovegrace.top → Reverse Proxy
#   Target: http://127.0.0.1:3020
#
# OR manually add this config to your OpenResty site directory.
# Path (typical 1Panel): /opt/1panel/apps/openresty/openresty/conf/conf.d/test.conf
#
# After adding, reload OpenResty:
#   docker exec <openresty-container-name> nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name test.arthurlovegrace.top;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.arthurlovegrace.top;

    # SSL certificate (Let's Encrypt via 1Panel or Certbot)
    # 1Panel auto-manages SSL — configure in 1Panel UI, not here.
    # If using manual cert:
    # ssl_certificate     /path/to/test.arthurlovegrace.top.crt;
    # ssl_certificate_key /path/to/test.arthurlovegrace.top.key;

    # Security headers
    add_header X-Robots-Tag "noindex, nofollow" always;  # Don't index test site
    add_header X-Test-Environment "true" always;

    # Rate limiting (prevent accidental/intentional abuse of test env)
    # Define zone in http block: limit_req_zone $binary_remote_addr zone=test_limit:10m rate=30r/s;
    # limit_req zone=test_limit burst=60 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Timeouts suitable for Next.js SSR
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }
}

name: R2 Changelog Consolidate (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consolidate:
    name: Consolidate R2 changelog to weekly
    runs-on: [self-hosted, linux, vps]
    steps:
      - name: Fetch W21 + W22 release bodies from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import subprocess, re, pathlib

          def get_release_body(tag):
              r = subprocess.run(
                  ["gh", "release", "view", tag,
                   "--repo", "ArthurloveLin/arthurs-blog",
                   "--json", "body", "--jq", ".body"],
                  capture_output=True, text=True
              )
              body = r.stdout.strip()
              # strip HTML comment blocks (metadata)
              return re.sub(r'<!--.*?-->', '', body, flags=re.DOTALL).strip()

          w22 = get_release_body("v2026.05.28-1521")
          w21 = get_release_body("v2026.05.24-1604")

          pathlib.Path("/tmp/r2-latest.md").write_text(w22 + "\n")
          pathlib.Path("/tmp/r2-all.md").write_text(
              "# Changelog\n\n本文件由 CI 自动维护。\n\n"
              + w22.rstrip() + "\n\n---\n\n"
              + w21.rstrip() + "\n"
          )
          print(f"latest.md: {len(w22)} chars")
          print(f"all.md:    {len(w22) + len(w21)} chars combined")
          PYEOF

      - name: Upload consolidated changelog to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_CDN_BUCKET: ${{ secrets.R2_CDN_BUCKET }}
        run: |
          python3 << 'PYEOF'
          import os, pathlib, boto3
          from botocore.config import Config

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4"),
              region_name="auto",
          )
          bucket = os.environ["R2_CDN_BUCKET"]

          for key, path in [
              ("changelog/latest.md", "/tmp/r2-latest.md"),
              ("changelog/all.md",    "/tmp/r2-all.md"),
          ]:
              body = pathlib.Path(path).read_bytes()
              s3.put_object(Bucket=bucket, Key=key, Body=body,
                            ContentType="text/markdown; charset=utf-8")
              print(f"Uploaded {key} ({len(body)} bytes)")
          PYEOF

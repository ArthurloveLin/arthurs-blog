name: Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - 'workers/**'
      - 'supabase/**'
      - '.agents/**'
      - '.claude/**'
      - 'tmp/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - 'workers/**'
      - 'supabase/**'
      - '.agents/**'
      - '.claude/**'
      - 'tmp/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/arthurlovelin/arthurs-blog

jobs:
  check:
    name: Type check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  docker:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract commit summary
        id: commit_info
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -1)
          echo "summary=${FIRST_LINE}" >> $GITHUB_OUTPUT

      - name: Validate publish-time public env vars
        if: github.event_name != 'pull_request'
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=${{ steps.commit_info.outputs.summary }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ github.event_name == 'pull_request' && 'https://placeholder.supabase.co' || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ github.event_name == 'pull_request' && 'placeholder' || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SPOTIFY_WORKER_URL=${{ vars.NEXT_PUBLIC_SPOTIFY_WORKER_URL }}
            NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL=${{ vars.NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL }}
            NEXT_PUBLIC_GENIUS_WORKER_URL=${{ vars.NEXT_PUBLIC_GENIUS_WORKER_URL }}
            NEXT_PUBLIC_ENGAGEMENT_WORKER_URL=${{ vars.NEXT_PUBLIC_ENGAGEMENT_WORKER_URL }}
            NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          secrets: |
            "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
            "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
            "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
            "R2_BLOG_BUCKET=${{ secrets.R2_BLOG_BUCKET }}"
            "R2_BLOG_PUBLIC_DOMAIN=${{ secrets.R2_BLOG_PUBLIC_DOMAIN }}"
            "R2_SPOTIFY_BUCKET=${{ secrets.R2_SPOTIFY_BUCKET }}"
            "R2_SPOTIFY_PUBLIC_DOMAIN=${{ secrets.R2_SPOTIFY_PUBLIC_DOMAIN }}"
            "R2_WARDROBE_BUCKET=${{ secrets.R2_WARDROBE_BUCKET }}"
            "R2_WARDROBE_PUBLIC_URL=${{ secrets.R2_WARDROBE_PUBLIC_URL }}"
            "R2_CDN_BUCKET=${{ secrets.R2_CDN_BUCKET }}"
            "R2_CDN_PUBLIC_DOMAIN=${{ secrets.R2_CDN_PUBLIC_DOMAIN }}"

  deploy:
    name: Trigger Watchtower deploy
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Watchtower webhook
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            https://arthurlovegrace.top/deploy
        timeout-minutes: 2

      - name: Send deploy notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -1)
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha "${{ github.sha }}" \
              --arg msg "$SUMMARY" \
              --arg image "${{ env.IMAGE_NAME }}" \
              '{
                topic: "watchtower-arthur71684",
                title: "🚀 arthurs-blog 部署成功",
                message: ("━━━━━━━━━━━━━━━━━━\n✅ 容器: arthurs-blog\n🐳 镜像: \($image)\n🔖 提交: \($sha[:7])\n📝 内容: \($msg)\n━━━━━━━━━━━━━━━━━━"),
                tags: ["white_check_mark"],
                priority: 3
              }')" \
            https://arthurlovegrace.top/ntfy-push

  notify-failure:
    name: Notify on failure
    needs: [check, docker, deploy]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send failure notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -1)

          if [ "${{ needs.check.result }}" = "failure" ]; then
            STAGE="类型检查 & Lint"
          elif [ "${{ needs.docker.result }}" = "failure" ]; then
            STAGE="Docker 构建 & 推送"
          else
            STAGE="部署触发"
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha "${{ github.sha }}" \
              --arg msg "$SUMMARY" \
              --arg stage "$STAGE" \
              --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                topic: "watchtower-arthur71684",
                title: "❌ arthurs-blog 构建失败",
                message: ("━━━━━━━━━━━━━━━━━━\n💥 阶段: \($stage)\n🔖 提交: \($sha[:7])\n📝 内容: \($msg)\n━━━━━━━━━━━━━━━━━━"),
                tags: ["x"],
                priority: 4,
                click: $run_url
              }')" \
            https://arthurlovegrace.top/ntfy-push

  release:
    name: Create version snapshot
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date -u +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Re-tag image without rebuild
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
            ${{ env.IMAGE_NAME }}:${SHA_TAG}

      - name: Get commit message
        id: commit
        run: |
          MSG=$(curl -fsS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.commit.message | split("\n")[0]')
          echo "message=${MSG}" >> $GITHUB_OUTPUT

      - name: Create annotated git tag
        run: |
          TAG_SHA=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/tags \
            -d "$(jq -n \
              --arg tag "${{ steps.version.outputs.tag }}" \
              --arg msg "${{ steps.commit.outputs.message }}" \
              --arg sha "${{ github.sha }}" \
              '{tag: $tag, message: $msg, object: $sha, type: "commit"}')" \
            | jq -r '.sha')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d "$(jq -n \
              --arg ref "refs/tags/${{ steps.version.outputs.tag }}" \
              --arg sha "${TAG_SHA}" \
              '{ref: $ref, sha: $sha}')"

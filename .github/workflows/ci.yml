name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - 'workers/**'
      - 'supabase/**'
      - '.claude/**'
      - '.agents/**'
      - 'tmp/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - 'workers/**'
      - 'supabase/**'
      - '.claude/**'
      - '.agents/**'
      - 'tmp/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/arthurlovelin/arthurs-blog

# Job dependency graph (push to main):
#
#   check → docker → deploy → release → ai-changelog
#         ↘ ai-fix   (on check failure — opens a fix PR)
#         ↘ ai-audit (on check success — non-blocking audit report)
#                     deploy → post-deploy-check (health + agy, non-blocking)
#                    ↘ notify (on failure)
#
# On PR: only check + docker build (no push, no deploy).
# AI PR Review gate lives in ai-pr-review.yml (separate workflow).

jobs:

# ─── 1. Static checks ──────────────────────────────────────────────────────────
  check:
    name: Type check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

# ─── 2. AI Auto-Fix (on check failure) ────────────────────────────────────────
#
# Runs only when the `check` job fails.
# Invokes agy to attempt automatic fixes, re-runs the check, and if it passes,
# opens a PR with the fixes on the same branch. Non-blocking — a crash here
# never affects the rest of the pipeline.
  ai-fix:
    name: AI Auto-Fix
    needs: check
    runs-on: [self-hosted, linux, vps]
    if: failure() && needs.check.result == 'failure'
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Idempotency check
        id: idempotency
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          EXISTING=$(git ls-remote --heads origin "refs/heads/ai-fix/${SHORT_SHA}" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "Fix branch already exists for ${SHORT_SHA} — skipping"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture check errors
        if: steps.idempotency.outputs.already_ran != 'true'
        run: |
          rm -f /tmp/ci-check-errors.md /tmp/ci-fix-prompt.md /tmp/ci-fix-result.md
          npm run check 2>&1 | tee /tmp/ci-check-errors.md || true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Assemble agy prompt
        if: steps.idempotency.outputs.already_ran != 'true'
        run: |
          python3 - << 'PYEOF'
          import pathlib
          template = pathlib.Path("tests/ai_hooks/prompts/ci_fix.md").read_text()
          errors = pathlib.Path("/tmp/ci-check-errors.md").read_text()
          prompt = template.replace("{CHECK_OUTPUT}", errors)
          pathlib.Path("/tmp/ci-fix-prompt.md").write_text(prompt)
          print(f"Prompt assembled: {len(prompt)} chars")
          PYEOF

      - name: Invoke agy to fix errors
        if: steps.idempotency.outputs.already_ran != 'true'
        timeout-minutes: 10
        run: |
          rm -rf ~/.gemini/antigravity-cli/brain/ 2>/dev/null || true
          /home/arthur/.local/bin/agy \
            --dangerously-skip-permissions \
            -p "$(cat /tmp/ci-fix-prompt.md)"

      - name: Re-run check to verify fix
        if: steps.idempotency.outputs.already_ran != 'true'
        id: verify
        continue-on-error: true
        run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Create branch and open PR
        if: steps.idempotency.outputs.already_ran != 'true' && steps.verify.outcome == 'success'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="ai-fix/${SHORT_SHA}"
          BASE_BRANCH="${{ github.head_ref || github.ref_name }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes produced by agy — skipping PR"
            exit 0
          fi

          git add -A
          COMMIT_MSG=$(printf 'fix(ai-auto): resolve type-check & lint errors for %s\n\nCo-Authored-By: agy <noreply@anthropic.com>' "${SHORT_SHA}")
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "fix(ai-auto): resolve type-check & lint errors [${SHORT_SHA}]" \
            --body-file tests/ai_hooks/pr_body_template_ci_fix.md \
            --base "$BASE_BRANCH" \
            --head "$BRANCH")
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Notify via ntfy
        if: steps.idempotency.outputs.already_ran != 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "${PR_URL:-}" ]; then
            TITLE="🤖 AI Auto-Fix PR Ready"
            MSG="CI 静态检查失败已由 AI 自动修复，PR 待审核: ${PR_URL}"
            TAG="white_check_mark"
            PRI=3
            CLICK="$PR_URL"
          else
            TITLE="🤖 AI Auto-Fix 失败"
            MSG="AI 尝试修复 CI 静态检查失败但未成功 (${SHORT_SHA})"
            TAG="x"
            PRI=2
            CLICK="$RUN_URL"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg msg "$MSG" \
              --arg tag "$TAG" \
              --argjson pri "$PRI" \
              --arg click "$CLICK" \
              '{
                topic: "watchtower-arthur71684",
                title: $title,
                message: $msg,
                tags: [$tag],
                priority: $pri,
                click: $click
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 3. Build & push Docker image ──────────────────────────────────────────────
  docker:
    name: Build & Push Image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract commit summary
        id: commit_info
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -1)
          echo "summary=${FIRST_LINE}" >> $GITHUB_OUTPUT

      - name: Validate publish-time public env vars
        if: github.event_name != 'pull_request'
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=${{ steps.commit_info.outputs.summary }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ github.event_name == 'pull_request' && 'https://placeholder.supabase.co' || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ github.event_name == 'pull_request' && 'placeholder' || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SPOTIFY_WORKER_URL=${{ vars.NEXT_PUBLIC_SPOTIFY_WORKER_URL }}
            NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL=${{ vars.NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL }}
            NEXT_PUBLIC_GENIUS_WORKER_URL=${{ vars.NEXT_PUBLIC_GENIUS_WORKER_URL }}
            NEXT_PUBLIC_ENGAGEMENT_WORKER_URL=${{ vars.NEXT_PUBLIC_ENGAGEMENT_WORKER_URL }}
            NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          secrets: |
            "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
            "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
            "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
            "R2_BLOG_BUCKET=${{ secrets.R2_BLOG_BUCKET }}"
            "R2_BLOG_PUBLIC_DOMAIN=${{ secrets.R2_BLOG_PUBLIC_DOMAIN }}"
            "R2_SPOTIFY_BUCKET=${{ secrets.R2_SPOTIFY_BUCKET }}"
            "R2_SPOTIFY_PUBLIC_DOMAIN=${{ secrets.R2_SPOTIFY_PUBLIC_DOMAIN }}"
            "R2_WARDROBE_BUCKET=${{ secrets.R2_WARDROBE_BUCKET }}"
            "R2_WARDROBE_PUBLIC_URL=${{ secrets.R2_WARDROBE_PUBLIC_URL }}"
            "R2_CDN_BUCKET=${{ secrets.R2_CDN_BUCKET }}"
            "R2_CDN_PUBLIC_DOMAIN=${{ secrets.R2_CDN_PUBLIC_DOMAIN }}"

# ─── 4. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Trigger Watchtower Deploy
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Watchtower webhook
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            https://arthurlovegrace.top/deploy
        timeout-minutes: 2

      - name: Send deploy notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -1)
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha "${{ github.sha }}" \
              --arg msg "$SUMMARY" \
              --arg image "${{ env.IMAGE_NAME }}" \
              '{
                topic: "watchtower-arthur71684",
                title: "🚀 arthurs-blog 部署成功",
                message: ("━━━━━━━━━━━━━━━━━━\n✅ 容器: arthurs-blog\n🐳 镜像: \($image)\n🔖 提交: \($sha[:7])\n📝 内容: \($msg)\n━━━━━━━━━━━━━━━━━━"),
                tags: ["white_check_mark"],
                priority: 3
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 5. Version snapshot ──────────────────────────────────────────────────────
  release:
    name: Create Version Snapshot
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date -u +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Re-tag image without rebuild
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
            ${{ env.IMAGE_NAME }}:${SHA_TAG}

      - name: Get commit message
        id: commit
        run: |
          MSG=$(curl -fsS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.commit.message | split("\n")[0]')
          echo "message=${MSG}" >> $GITHUB_OUTPUT

      - name: Create annotated git tag
        run: |
          TAG_SHA=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/tags \
            -d "$(jq -n \
              --arg tag "${{ steps.version.outputs.tag }}" \
              --arg msg "${{ steps.commit.outputs.message }}" \
              --arg sha "${{ github.sha }}" \
              '{tag: $tag, message: $msg, object: $sha, type: "commit"}')" \
            | jq -r '.sha')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d "$(jq -n \
              --arg ref "refs/tags/${{ steps.version.outputs.tag }}" \
              --arg sha "${TAG_SHA}" \
              '{ref: $ref, sha: $sha}')"

# ─── 5a. Post-Deploy Health Check (non-blocking) ─────────────────────────────
#
# Waits 2 min for Watchtower to apply the new image, then collects docker logs
# and /api/health response, asks agy to detect anomalies, and pushes ntfy.
# ANOMALY: YES triggers a priority-4 warning; NO sends a quiet confirmation.
  post-deploy-check:
    name: Post-Deploy Health Check
    needs: deploy
    runs-on: [self-hosted, linux, vps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Wait for container restart
        run: sleep 120

      - name: Collect docker logs
        run: |
          docker logs arthurs-blog --tail 200 2>&1 > /tmp/deploy-logs.txt \
            || echo "docker logs 不可用" > /tmp/deploy-logs.txt

      - name: Probe /api/health
        run: |
          curl -fsS -w "\nHTTP_STATUS:%{http_code}" \
            https://arthurlovegrace.top/api/health \
            -o /tmp/health-response.txt 2>&1 \
            || echo "CURL_FAILED:$?" >> /tmp/health-response.txt

      - name: Assemble agy prompt
        run: |
          python3 - << 'PYEOF'
          import pathlib
          template = pathlib.Path("tests/ai_hooks/prompts/post_deploy_health.md").read_text()
          logs     = pathlib.Path("/tmp/deploy-logs.txt").read_text(errors="replace")[:15000]
          health   = pathlib.Path("/tmp/health-response.txt").read_text(errors="replace")[:2000]
          sha      = "${{ github.sha }}"
          prompt   = (template
                      .replace("{DOCKER_LOGS}", logs)
                      .replace("{HEALTH_RESPONSE}", health)
                      .replace("{COMMIT_SHA}", sha[:7]))
          pathlib.Path("/tmp/ai-health-prompt.md").write_text(prompt)
          print(f"Prompt assembled: {len(prompt)} chars")
          PYEOF

      - name: Invoke agy
        continue-on-error: true
        timeout-minutes: 5
        run: |
          rm -rf ~/.gemini/antigravity-cli/brain/ 2>/dev/null || true
          /home/arthur/.local/bin/agy \
            --dangerously-skip-permissions \
            -p "$(cat /tmp/ai-health-prompt.md)"

      - name: Parse anomaly result and notify
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ -f /tmp/ai-health-result.md ]; then
            ANOMALY=$(grep "^ANOMALY:" /tmp/ai-health-result.md | head -1 | awk '{print $2}')
            SUMMARY=$(tail -n +2 /tmp/ai-health-result.md | head -c 1200)
          else
            ANOMALY="UNKNOWN"
            SUMMARY="agy 未产生输出，请手动检查 docker logs 和 /api/health"
          fi

          if [ "$ANOMALY" = "YES" ]; then
            TITLE="⚠️ 部署健康异常 — ${SHORT_SHA}"
            TAGS='["warning"]'
            PRI=4
            MSG="${SUMMARY}\n\n🔧 建议人工检查并通过 Watchtower Webhook 手动触发回滚"
          else
            TITLE="✅ 部署健康正常 — ${SHORT_SHA}"
            TAGS='["white_check_mark"]'
            PRI=2
            MSG="${SUMMARY:-容器日志无异常，/api/health 响应正常}"
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg msg "$MSG" \
              --argjson tags "$TAGS" \
              --argjson pri "$PRI" \
              --arg click "$RUN_URL" \
              '{
                topic: "watchtower-arthur71684",
                title: $title,
                message: $msg,
                tags: $tags,
                priority: $pri,
                click: $click
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 5b. AI Changelog & GitHub Release (non-blocking) ────────────────────────
#
# Runs after release job. Generates a Keep a Changelog entry via agy,
# prepends it to CHANGELOG.md, commits [skip ci] to main, then
# creates an auto-published GitHub Release with the AI-generated notes.
  ai-changelog:
    name: AI Changelog & GitHub Release
    needs: release
    runs-on: [self-hosted, linux, vps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git bot identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Collect git log since previous tag
        run: |
          NEW_TAG="${{ needs.release.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${NEW_TAG}^" 2>/dev/null || echo "")
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          echo "PREV_TAG=${PREV_TAG}" >> $GITHUB_ENV
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${NEW_TAG}" --format="* %s (%h)" | head -c 20000 > /tmp/git-log.txt
          else
            git log "${NEW_TAG}" --format="* %s (%h)" | head -c 20000 > /tmp/git-log.txt
          fi
          echo "Log lines: $(wc -l < /tmp/git-log.txt)"

      - name: Assemble agy prompt
        run: |
          python3 - << 'PYEOF'
          import pathlib, os
          template = pathlib.Path("tests/ai_hooks/prompts/ai_changelog.md").read_text()
          git_log  = pathlib.Path("/tmp/git-log.txt").read_text(errors="replace")
          prompt   = (template
                      .replace("{GIT_LOG}", git_log)
                      .replace("{NEW_TAG}", os.environ.get("NEW_TAG", ""))
                      .replace("{PREV_TAG}", os.environ.get("PREV_TAG", "(首个版本)")))
          pathlib.Path("/tmp/ai-changelog-prompt.md").write_text(prompt)
          print(f"Prompt assembled: {len(prompt)} chars")
          PYEOF

      - name: Invoke agy
        continue-on-error: true
        timeout-minutes: 8
        run: |
          rm -rf ~/.gemini/antigravity-cli/brain/ 2>/dev/null || true
          /home/arthur/.local/bin/agy \
            --dangerously-skip-permissions \
            -p "$(cat /tmp/ai-changelog-prompt.md)"

      - name: Prepend to CHANGELOG.md and push
        continue-on-error: true
        run: |
          if [ ! -f /tmp/ai-changelog.md ]; then
            echo "agy 未生成 changelog，跳过 CHANGELOG.md 更新"
            exit 0
          fi
          touch CHANGELOG.md
          cat /tmp/ai-changelog.md <(echo) CHANGELOG.md > /tmp/CHANGELOG.tmp
          mv /tmp/CHANGELOG.tmp CHANGELOG.md
          git pull --rebase origin main
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${NEW_TAG} [skip ci]"
          git push origin main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/ai-changelog.md ]; then
            gh release create "${NEW_TAG}" \
              --title "${NEW_TAG}" \
              --notes-file /tmp/ai-changelog.md
          else
            gh release create "${NEW_TAG}" \
              --title "${NEW_TAG}" \
              --notes "Changelog 生成失败，请手动补充。"
          fi

      - name: Notify via ntfy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL=$(gh release view "${NEW_TAG}" --json url -q .url 2>/dev/null || echo "$RUN_URL")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "${NEW_TAG}" \
              --arg click "$RELEASE_URL" \
              '{
                topic: "watchtower-arthur71684",
                title: ("📦 新版本发布 — " + $tag),
                message: "CHANGELOG 已更新，GitHub Release 已创建。",
                tags: ["package"],
                priority: 3,
                click: $click
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 5c. AI Main Audit (non-blocking) ────────────────────────────────────────
#
# Runs in parallel with docker build on every push to main.
# Reads the pushed diff, invokes agy to produce an audit report, writes it to
# GITHUB_STEP_SUMMARY and uploads it as an artifact. Never blocks the pipeline.
  ai-audit:
    name: AI Main Audit
    needs: check
    runs-on: [self-hosted, linux, vps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Extract commit diff (50 KB cap)
        run: |
          rm -f /tmp/main-diff.md /tmp/main-audit-prompt.md /tmp/ai-audit-result.md
          # Use event.before so squash merges produce the full logical diff.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # Fallback to HEAD~1 if before is the zero SHA (first push to branch).
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          git diff "${BEFORE}" "${AFTER}" | head -c 51200 > /tmp/main-diff.md
          echo "Diff size: $(wc -c < /tmp/main-diff.md) bytes"

      - name: Assemble agy prompt
        run: |
          python3 - << 'PYEOF'
          import pathlib
          template = pathlib.Path("tests/ai_hooks/prompts/main_audit.md").read_text()
          diff     = pathlib.Path("/tmp/main-diff.md").read_text(errors="replace")
          sha      = "${{ github.sha }}"
          prompt   = template.replace("{MAIN_DIFF}", diff).replace("{COMMIT_SHA}", sha[:7])
          pathlib.Path("/tmp/main-audit-prompt.md").write_text(prompt)
          print(f"Prompt assembled: {len(prompt)} chars")
          PYEOF

      - name: Invoke agy
        continue-on-error: true
        timeout-minutes: 5
        run: |
          rm -rf ~/.gemini/antigravity-cli/brain/ 2>/dev/null || true
          /home/arthur/.local/bin/agy \
            --dangerously-skip-permissions \
            -p "$(cat /tmp/main-audit-prompt.md)"

      - name: Publish to Step Summary
        if: always()
        run: |
          if [ -f /tmp/ai-audit-result.md ]; then
            cat /tmp/ai-audit-result.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '> ⚠️ AI Audit: agy 未产生输出，请检查 runner 日志。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/ai-audit-result.md

      - name: Notify via ntfy
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f /tmp/ai-audit-result.md ]; then
            CONTENT=$(head -c 1500 /tmp/ai-audit-result.md)
            TITLE="📋 AI Main Audit — ${SHORT_SHA}"
          else
            CONTENT="AI Audit 不可用（agy 未产生输出）"
            TITLE="📋 AI Main Audit — 不可用"
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "📋 AI Main Audit — ${SHORT_SHA}" \
              --arg msg "$CONTENT" \
              --arg click "$RUN_URL" \
              '{
                topic: "watchtower-arthur71684",
                title: $title,
                message: $msg,
                tags: ["clipboard"],
                priority: 2,
                click: $click
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 6. Failure notification ──────────────────────────────────────────────────
  notify:
    name: Notify on Failure
    needs: [check, docker, deploy]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Determine failure stage
        id: status
        run: |
          if [ "${{ needs.check.result }}" = "failure" ]; then
            echo "stage=类型检查 & Lint" >> $GITHUB_OUTPUT
          elif [ "${{ needs.docker.result }}" = "failure" ]; then
            echo "stage=Docker 构建" >> $GITHUB_OUTPUT
          else
            echo "stage=部署触发" >> $GITHUB_OUTPUT
          fi

      - name: Send failure notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -1)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha "${{ github.sha }}" \
              --arg msg "$SUMMARY" \
              --arg stage "${{ steps.status.outputs.stage }}" \
              --arg url "$RUN_URL" \
              '{
                topic: "watchtower-arthur71684",
                title: "❌ CI 失败",
                message: ("━━━━━━━━━━━━━━━━━━\n💥 阶段: \($stage)\n🔖 提交: \($sha[:7])\n📝 内容: \($msg)\n━━━━━━━━━━━━━━━━━━"),
                tags: ["x"],
                priority: 4,
                click: $url
              }')" \
            https://arthurlovegrace.top/ntfy-push

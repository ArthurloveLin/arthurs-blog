name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - 'workers/**'
      - 'supabase/**'
      - '.claude/**'
      - '.agents/**'
      - 'tmp/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - 'workers/**'
      - 'supabase/**'
      - '.claude/**'
      - '.agents/**'
      - 'tmp/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/arthurlovelin/arthurs-blog

# Job dependency graph (push to main):
#
#   check → docker → deploy → release
#         ↘ ai-fix (on check failure — opens a fix PR)
#                  ↘ notify (on failure)
#
# On PR: only check + docker build (no push, no deploy).

jobs:

# ─── 1. Static checks ──────────────────────────────────────────────────────────
  check:
    name: Type check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

# ─── 2. AI Auto-Fix (on check failure) ────────────────────────────────────────
#
# Runs only when the `check` job fails.
# Invokes agy to attempt automatic fixes, re-runs the check, and if it passes,
# opens a PR with the fixes on the same branch. Non-blocking — a crash here
# never affects the rest of the pipeline.
  ai-fix:
    name: AI Auto-Fix
    needs: check
    runs-on: [self-hosted, linux, vps]
    if: failure() && needs.check.result == 'failure'
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Idempotency check
        id: idempotency
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          EXISTING=$(git ls-remote --heads origin "refs/heads/ai-fix/${SHORT_SHA}" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "Fix branch already exists for ${SHORT_SHA} — skipping"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture check errors
        if: steps.idempotency.outputs.already_ran != 'true'
        run: |
          rm -f /tmp/ci-check-errors.md /tmp/ci-fix-prompt.md /tmp/ci-fix-result.md
          npm run check 2>&1 | tee /tmp/ci-check-errors.md || true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Assemble agy prompt
        if: steps.idempotency.outputs.already_ran != 'true'
        run: |
          python3 - << 'PYEOF'
          import pathlib
          template = pathlib.Path("tests/ai_hooks/prompts/ci_fix.md").read_text()
          errors = pathlib.Path("/tmp/ci-check-errors.md").read_text()
          prompt = template.replace("{CHECK_OUTPUT}", errors)
          pathlib.Path("/tmp/ci-fix-prompt.md").write_text(prompt)
          print(f"Prompt assembled: {len(prompt)} chars")
          PYEOF

      - name: Invoke agy to fix errors
        if: steps.idempotency.outputs.already_ran != 'true'
        timeout-minutes: 10
        run: |
          rm -rf ~/.gemini/antigravity-cli/brain/ 2>/dev/null || true
          /home/arthur/.local/bin/agy \
            --dangerously-skip-permissions \
            -p "$(cat /tmp/ci-fix-prompt.md)"

      - name: Re-run check to verify fix
        if: steps.idempotency.outputs.already_ran != 'true'
        id: verify
        continue-on-error: true
        run: npm run check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Create branch and open PR
        if: steps.idempotency.outputs.already_ran != 'true' && steps.verify.outcome == 'success'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="ai-fix/${SHORT_SHA}"
          BASE_BRANCH="${{ github.head_ref || github.ref_name }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes produced by agy — skipping PR"
            exit 0
          fi

          git add -A
          COMMIT_MSG=$(printf 'fix(ai-auto): resolve type-check & lint errors for %s\n\nCo-Authored-By: agy <noreply@anthropic.com>' "${SHORT_SHA}")
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "fix(ai-auto): resolve type-check & lint errors [${SHORT_SHA}]" \
            --body-file tests/ai_hooks/pr_body_template_ci_fix.md \
            --base "$BASE_BRANCH" \
            --head "$BRANCH")
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Notify via ntfy
        if: steps.idempotency.outputs.already_ran != 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "${PR_URL:-}" ]; then
            TITLE="🤖 AI Auto-Fix PR Ready"
            MSG="CI 静态检查失败已由 AI 自动修复，PR 待审核: ${PR_URL}"
            TAG="white_check_mark"
            PRI=3
            CLICK="$PR_URL"
          else
            TITLE="🤖 AI Auto-Fix 失败"
            MSG="AI 尝试修复 CI 静态检查失败但未成功 (${SHORT_SHA})"
            TAG="x"
            PRI=2
            CLICK="$RUN_URL"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg msg "$MSG" \
              --arg tag "$TAG" \
              --argjson pri "$PRI" \
              --arg click "$CLICK" \
              '{
                topic: "watchtower-arthur71684",
                title: $title,
                message: $msg,
                tags: [$tag],
                priority: $pri,
                click: $click
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 3. Build & push Docker image ──────────────────────────────────────────────
  docker:
    name: Build & Push Image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract commit summary
        id: commit_info
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -1)
          echo "summary=${FIRST_LINE}" >> $GITHUB_OUTPUT

      - name: Validate publish-time public env vars
        if: github.event_name != 'pull_request'
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=${{ steps.commit_info.outputs.summary }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ github.event_name == 'pull_request' && 'https://placeholder.supabase.co' || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ github.event_name == 'pull_request' && 'placeholder' || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SPOTIFY_WORKER_URL=${{ vars.NEXT_PUBLIC_SPOTIFY_WORKER_URL }}
            NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL=${{ vars.NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL }}
            NEXT_PUBLIC_GENIUS_WORKER_URL=${{ vars.NEXT_PUBLIC_GENIUS_WORKER_URL }}
            NEXT_PUBLIC_ENGAGEMENT_WORKER_URL=${{ vars.NEXT_PUBLIC_ENGAGEMENT_WORKER_URL }}
            NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          secrets: |
            "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
            "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
            "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
            "R2_BLOG_BUCKET=${{ secrets.R2_BLOG_BUCKET }}"
            "R2_BLOG_PUBLIC_DOMAIN=${{ secrets.R2_BLOG_PUBLIC_DOMAIN }}"
            "R2_SPOTIFY_BUCKET=${{ secrets.R2_SPOTIFY_BUCKET }}"
            "R2_SPOTIFY_PUBLIC_DOMAIN=${{ secrets.R2_SPOTIFY_PUBLIC_DOMAIN }}"
            "R2_WARDROBE_BUCKET=${{ secrets.R2_WARDROBE_BUCKET }}"
            "R2_WARDROBE_PUBLIC_URL=${{ secrets.R2_WARDROBE_PUBLIC_URL }}"
            "R2_CDN_BUCKET=${{ secrets.R2_CDN_BUCKET }}"
            "R2_CDN_PUBLIC_DOMAIN=${{ secrets.R2_CDN_PUBLIC_DOMAIN }}"

# ─── 4. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Trigger Watchtower Deploy
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Watchtower webhook
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            https://arthurlovegrace.top/deploy
        timeout-minutes: 2

      - name: Send deploy notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -1)
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha "${{ github.sha }}" \
              --arg msg "$SUMMARY" \
              --arg image "${{ env.IMAGE_NAME }}" \
              '{
                topic: "watchtower-arthur71684",
                title: "🚀 arthurs-blog 部署成功",
                message: ("━━━━━━━━━━━━━━━━━━\n✅ 容器: arthurs-blog\n🐳 镜像: \($image)\n🔖 提交: \($sha[:7])\n📝 内容: \($msg)\n━━━━━━━━━━━━━━━━━━"),
                tags: ["white_check_mark"],
                priority: 3
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 5. Version snapshot ──────────────────────────────────────────────────────
  release:
    name: Create Version Snapshot
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date -u +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Re-tag image without rebuild
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
            ${{ env.IMAGE_NAME }}:${SHA_TAG}

      - name: Get commit message
        id: commit
        run: |
          MSG=$(curl -fsS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.commit.message | split("\n")[0]')
          echo "message=${MSG}" >> $GITHUB_OUTPUT

      - name: Create annotated git tag
        run: |
          TAG_SHA=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/tags \
            -d "$(jq -n \
              --arg tag "${{ steps.version.outputs.tag }}" \
              --arg msg "${{ steps.commit.outputs.message }}" \
              --arg sha "${{ github.sha }}" \
              '{tag: $tag, message: $msg, object: $sha, type: "commit"}')" \
            | jq -r '.sha')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d "$(jq -n \
              --arg ref "refs/tags/${{ steps.version.outputs.tag }}" \
              --arg sha "${TAG_SHA}" \
              '{ref: $ref, sha: $sha}')"

# ─── 6. Failure notification ──────────────────────────────────────────────────
  notify:
    name: Notify on Failure
    needs: [check, docker, deploy]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Determine failure stage
        id: status
        run: |
          if [ "${{ needs.check.result }}" = "failure" ]; then
            echo "stage=类型检查 & Lint" >> $GITHUB_OUTPUT
          elif [ "${{ needs.docker.result }}" = "failure" ]; then
            echo "stage=Docker 构建" >> $GITHUB_OUTPUT
          else
            echo "stage=部署触发" >> $GITHUB_OUTPUT
          fi

      - name: Send failure notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -1)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha "${{ github.sha }}" \
              --arg msg "$SUMMARY" \
              --arg stage "${{ steps.status.outputs.stage }}" \
              --arg url "$RUN_URL" \
              '{
                topic: "watchtower-arthur71684",
                title: "❌ CI 失败",
                message: ("━━━━━━━━━━━━━━━━━━\n💥 阶段: \($stage)\n🔖 提交: \($sha[:7])\n📝 内容: \($msg)\n━━━━━━━━━━━━━━━━━━"),
                tags: ["x"],
                priority: 4,
                click: $url
              }')" \
            https://arthurlovegrace.top/ntfy-push

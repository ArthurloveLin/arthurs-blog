name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 10:00 CST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Tests the currently deployed :latest image — no rebuild, no deploy.
#
# Job graph:
#
#   setup → api-tests ──┐
#         → infra-tests ─┼→ teardown (always)
#         → e2e-tests ───┘
#                        ├→ report (always)   → notify (always)
#                        └→ perf-tests ───────┘
#
#   ai-analysis (on failure)

jobs:

# ─── 1. Start test container ───────────────────────────────────────────────────
  setup:
    name: Start Test Container
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env.test.local from secrets
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BLOG_BUCKET: ${{ secrets.R2_BLOG_BUCKET }}
          R2_BLOG_PUBLIC_DOMAIN: ${{ secrets.R2_BLOG_PUBLIC_DOMAIN }}
          R2_WARDROBE_BUCKET: ${{ secrets.R2_WARDROBE_BUCKET }}
          R2_WARDROBE_PUBLIC_URL: ${{ secrets.R2_WARDROBE_PUBLIC_URL }}
          R2_CDN_BUCKET: ${{ secrets.R2_CDN_BUCKET }}
          R2_CDN_PUBLIC_DOMAIN: ${{ secrets.R2_CDN_PUBLIC_DOMAIN }}
          NEXT_PUBLIC_ENGAGEMENT_WORKER_URL: ${{ secrets.NEXT_PUBLIC_ENGAGEMENT_WORKER_URL }}
          NEXT_PUBLIC_SPOTIFY_WORKER_URL: ${{ secrets.NEXT_PUBLIC_SPOTIFY_WORKER_URL }}
          NEXT_PUBLIC_GENIUS_WORKER_URL: ${{ secrets.NEXT_PUBLIC_GENIUS_WORKER_URL }}
          NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL: ${{ secrets.NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL }}
          MEMO_PUBLIC_OWNER_ID: ${{ secrets.MEMO_PUBLIC_OWNER_ID }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${TEST_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${TEST_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${TEST_SUPABASE_SERVICE_ROLE_KEY}"
            echo "TEST_ADMIN_EMAIL=${TEST_ADMIN_EMAIL}"
            echo "TEST_ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD}"
            echo "R2_ACCOUNT_ID=${R2_ACCOUNT_ID}"
            echo "R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
            echo "R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
            echo "R2_BLOG_BUCKET=${R2_BLOG_BUCKET}"
            echo "R2_BLOG_PUBLIC_DOMAIN=${R2_BLOG_PUBLIC_DOMAIN}"
            echo "R2_WARDROBE_BUCKET=${R2_WARDROBE_BUCKET}"
            echo "R2_WARDROBE_PUBLIC_URL=${R2_WARDROBE_PUBLIC_URL}"
            echo "R2_CDN_BUCKET=${R2_CDN_BUCKET}"
            echo "R2_CDN_PUBLIC_DOMAIN=${R2_CDN_PUBLIC_DOMAIN}"
            echo "NEXT_PUBLIC_ENGAGEMENT_WORKER_URL=${NEXT_PUBLIC_ENGAGEMENT_WORKER_URL}"
            echo "NEXT_PUBLIC_SPOTIFY_WORKER_URL=${NEXT_PUBLIC_SPOTIFY_WORKER_URL}"
            echo "NEXT_PUBLIC_GENIUS_WORKER_URL=${NEXT_PUBLIC_GENIUS_WORKER_URL}"
            echo "NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL=${NEXT_PUBLIC_SPOTIFY_NOW_PLAYING_WORKER_URL}"
            echo "MEMO_PUBLIC_OWNER_ID=${MEMO_PUBLIC_OWNER_ID}"
            echo "NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "CLOUDFLARE_TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3020"
          } > .env.test.local

      - name: Pull latest image
        run: docker pull ghcr.io/arthurlovelin/arthurs-blog:latest

      - name: Stop any existing test container
        run: docker compose -f tests/docker-compose.test.yml down --remove-orphans 2>/dev/null || true

      - name: Start test container
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Wait for health check
        run: |
          for i in $(seq 1 18); do
            if curl -sf http://localhost:3020/api/blog/search?q=test -o /dev/null; then
              echo "✅ Container healthy after ${i}0s"
              exit 0
            fi
            echo "⏳ attempt $i/18"
            sleep 10
          done
          docker logs arthurs-blog-test --tail 50
          exit 1

# ─── 2. API Integration Tests ──────────────────────────────────────────────────
  api-tests:
    name: API Integration Tests
    needs: setup
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt

      - name: Run API tests
        env:
          TEST_BASE_URL: http://localhost:3020
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/api/ -v \
            --alluredir=allure-results/api \
            --junit-xml=tests/ai_hooks/report.xml \
            --timeout=30 \
            -m "not slow"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-${{ github.run_number }}
          path: allure-results/api/

      - name: Upload JUnit report (for AI analysis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-junit-${{ github.run_number }}
          path: tests/ai_hooks/report.xml

# ─── 3. Docker Infrastructure Tests ───────────────────────────────────────────
  infra-tests:
    name: Docker Infra Tests
    needs: setup
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt

      - name: Run infrastructure tests
        run: |
          pytest tests/infra/ -v \
            --hosts=docker://arthurs-blog-test \
            --alluredir=allure-results/infra \
            --junit-xml=allure-results/infra-junit.xml \
            --timeout=30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-infra-${{ github.run_number }}
          path: allure-results/infra/

      - name: Upload JUnit report (for AI analysis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-junit-infra-${{ github.run_number }}
          path: allure-results/infra-junit.xml

# ─── 4. E2E Tests ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    needs: api-tests
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt

      - name: Remove broken apt sources
        run: sudo rm -f /etc/apt/sources.list.d/ookla_speedtest-cli.list || true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E smoke tests (blocking)
        env:
          TEST_BASE_URL: http://localhost:3020
        run: |
          pytest tests/e2e/ -v \
            -m smoke \
            --alluredir=allure-results/e2e \
            --junit-xml=allure-results/e2e-smoke-junit.xml \
            --timeout=60 \
            --browser=chromium

      - name: Run E2E full tests (non-blocking)
        env:
          TEST_BASE_URL: http://localhost:3020
        run: |
          pytest tests/e2e/ -v \
            -m "not smoke" \
            --alluredir=allure-results/e2e \
            --junit-xml=allure-results/e2e-full-junit.xml \
            --timeout=60 \
            --browser=chromium || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e-${{ github.run_number }}
          path: allure-results/e2e/

# ─── 5. Teardown ──────────────────────────────────────────────────────────────
  teardown:
    name: Stop Test Container
    needs: [api-tests, infra-tests, e2e-tests]
    runs-on: [self-hosted, linux, vps]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tests/docker-compose.test.yml down --remove-orphans

# ─── 6. Generate Allure Report ────────────────────────────────────────────────
  report:
    name: Generate Allure Report
    needs: [api-tests, infra-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download API allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-api-${{ github.run_number }}
          path: allure-results/

      - name: Download Infra allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-infra-${{ github.run_number }}
          path: allure-results/

      - name: Download E2E allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-e2e-${{ github.run_number }}
          path: allure-results/

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Cache Allure CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: allure-cli-${{ runner.os }}

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results/ -o allure-report/ --clean

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          if-no-files-found: warn

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report/
          destination_dir: allure
          keep_files: false
          commit_message: "ci: update allure report [nightly run ${{ github.run_number }}]"

      - name: Sync Allure report to R2 CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_CDN_BUCKET: ${{ secrets.R2_CDN_BUCKET }}
        run: |
          aws s3 sync allure-report/ s3://${R2_CDN_BUCKET}/allure/latest/ \
            --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --delete \
            --cache-control "public,max-age=3600"

# ─── 7. Performance Tests ─────────────────────────────────────────────────────
  perf-tests:
    name: Performance Tests (Locust)
    needs: [api-tests, infra-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Run Locust performance smoke test
        id: locust
        continue-on-error: true
        env:
          PERF_TARGET_HOST: ${{ vars.TEST_SITE_URL || 'https://test.arthurlovegrace.top' }}
        run: |
          locust -f tests/perf/locustfile.py \
            --headless \
            -u 20 -r 2 \
            --run-time 60s \
            --host "$PERF_TARGET_HOST" \
            --csv tests/perf/results \
            --exit-code-on-error 1 \
            --html tests/perf/report.html

      - name: Check performance thresholds
        if: always()
        continue-on-error: true
        run: |
          python tests/perf/thresholds.py \
            --csv tests/perf/results_stats.csv \
            --markdown-out tests/perf/thresholds-summary.md

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            tests/perf/results*.csv
            tests/perf/report.html
            tests/perf/thresholds-summary.md

      - name: Publish performance summary
        if: always()
        env:
          PERF_TARGET_HOST: ${{ vars.TEST_SITE_URL || 'https://test.arthurlovegrace.top' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOCUST_OUTCOME: ${{ steps.locust.outcome }}
        run: |
          {
            echo "## Performance Report"
            echo
            echo "- Target: ${PERF_TARGET_HOST}"
            echo "- Locust run: ${LOCUST_OUTCOME}"
            echo
            if [ -f tests/perf/thresholds-summary.md ]; then
              cat tests/perf/thresholds-summary.md
            else
              echo "Performance report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# ─── 8. Notify Result ─────────────────────────────────────────────────────────
  notify:
    name: Notify Result
    needs: [api-tests, infra-tests, e2e-tests, report, perf-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send result notification
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          INFRA_RESULT: ${{ needs.infra-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          PERF_RESULT: ${{ needs.perf-tests.result }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fmt() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          ALL_PASS=$([[ "$API_RESULT" == "success" && "$INFRA_RESULT" == "success" && "$E2E_RESULT" == "success" ]] && echo true || echo false)
          TITLE=$([ "$ALL_PASS" = "true" ] && echo "✅ Nightly Tests Passed" || echo "❌ Nightly Tests Failed")
          SUMMARY="API $(fmt $API_RESULT)  Infra $(fmt $INFRA_RESULT)  E2E $(fmt $E2E_RESULT)  Perf $(fmt $PERF_RESULT)"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg summary "$SUMMARY" \
              --arg pages "$PAGES_URL" \
              --arg run "$RUN_URL" \
              '{
                topic: "watchtower-arthur71684",
                title: $title,
                message: ("测试: \($summary)\n报告: \($pages)"),
                tags: ["bar_chart"],
                priority: 2,
                click: $pages
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 9. AI Nightly Summary ─────────────────────────────────────────────────────
#
# Always runs after api-tests + infra-tests (success or failure).
# Picks the prompt template based on whether any test job failed:
#   failure → failure_analysis.md (root-cause analysis)
#   success → test_summary.md    (brief all-clear summary)
#
# Runs on VPS (self-hosted) so agy OAuth credentials are available.
# continue-on-error: true at the agy step level so a crash never drops the
# ntfy notification — the step falls back to the raw context.
  ai-analysis:
    name: AI Nightly Summary
    needs: [api-tests, infra-tests]
    runs-on: [self-hosted, linux, vps]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download API JUnit report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nightly-junit-${{ github.run_number }}
          path: tests/ai_hooks/

      - name: Download infra JUnit report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nightly-junit-infra-${{ github.run_number }}
          path: tests/ai_hooks/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format test report
        run: |
          rm -f /tmp/failure-context.md /tmp/failure-analysis-prompt.md /tmp/ai-analysis-result.md
          # Collect whichever JUnit XMLs arrived — partial downloads are fine.
          INPUTS=()
          [ -f tests/ai_hooks/report.xml ]       && INPUTS+=(tests/ai_hooks/report.xml)
          [ -f tests/ai_hooks/infra-junit.xml ]  && INPUTS+=(tests/ai_hooks/infra-junit.xml)
          if [ ${#INPUTS[@]} -gt 0 ]; then
            python3 tests/ai_hooks/format_report.py \
              --input "${INPUTS[@]}" \
              --output /tmp/failure-context.md
          else
            echo "# Test Report" > /tmp/failure-context.md
            echo "" >> /tmp/failure-context.md
            echo "No JUnit XML reports were available. Check CI logs for details." >> /tmp/failure-context.md
          fi
          echo "=== Test Context ==="
          cat /tmp/failure-context.md

      - name: Choose prompt template
        id: prompt
        run: |
          API="${{ needs.api-tests.result }}"
          INFRA="${{ needs.infra-tests.result }}"
          if [ "$API" = "failure" ] || [ "$API" = "cancelled" ] || \
             [ "$INFRA" = "failure" ] || [ "$INFRA" = "cancelled" ]; then
            echo "template=failure_analysis" >> "$GITHUB_OUTPUT"
            echo "title=🤖 AI Failure Analysis" >> "$GITHUB_OUTPUT"
            echo "tag=mag" >> "$GITHUB_OUTPUT"
            echo "priority=3" >> "$GITHUB_OUTPUT"
          else
            echo "template=test_summary" >> "$GITHUB_OUTPUT"
            echo "title=🤖 AI Nightly Summary" >> "$GITHUB_OUTPUT"
            echo "tag=white_check_mark" >> "$GITHUB_OUTPUT"
            echo "priority=2" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble agy prompt
        run: |
          python3 - << 'PYEOF'
          import pathlib
          template_name = "${{ steps.prompt.outputs.template }}"
          template = pathlib.Path(f"tests/ai_hooks/prompts/{template_name}.md").read_text()
          context = pathlib.Path("/tmp/failure-context.md").read_text()
          prompt = template.replace("{FAILURE_CONTEXT}", context)
          pathlib.Path("/tmp/failure-analysis-prompt.md").write_text(prompt)
          print(f"Prompt assembled ({template_name}): {len(prompt)} chars")
          PYEOF

      - name: Invoke agy
        continue-on-error: true
        timeout-minutes: 5
        run: |
          rm -rf ~/.gemini/antigravity-cli/brain/ 2>/dev/null || true
          /home/arthur/.local/bin/agy \
            --dangerously-skip-permissions \
            -p "$(cat /tmp/failure-analysis-prompt.md)"

      - name: Send summary via ntfy
        run: |
          TITLE="${{ steps.prompt.outputs.title }}"
          TAG="${{ steps.prompt.outputs.tag }}"
          PRIORITY="${{ steps.prompt.outputs.priority }}"
          if [ -f /tmp/ai-analysis-result.md ]; then
            CONTENT=$(head -c 3000 /tmp/ai-analysis-result.md)
          else
            CONTENT=$(head -c 1500 /tmp/failure-context.md)
            TITLE="$TITLE (raw)"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg msg "$CONTENT" \
              --arg tag "$TAG" \
              --argjson pri "$PRIORITY" \
              '{
                topic: "watchtower-arthur71684",
                title: $title,
                message: $msg,
                tags: [$tag],
                priority: $pri
              }')" \
            https://arthurlovegrace.top/ntfy-push

# ─── 10. AI Test Generation ────────────────────────────────────────────────────
#
# Non-blocking job that runs after the test container is torn down.
# Scans git commits from the last 24h for source files without test coverage,
# invokes agy to generate pytest stubs, validates them, and opens a PR.
# continue-on-error: true — a failure here never affects the nightly run result.
  ai-test-gen:
    name: AI Test Generation
    needs: [teardown]
    runs-on: [self-hosted, linux, vps]
    if: always()
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history needed for git log --since

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Scan coverage gaps
        id: scan
        run: |
          # Remove stale tmp files from previous runs — /tmp persists on self-hosted runners.
          rm -f /tmp/coverage-gaps.md /tmp/test-gen-prompt.md /tmp/agy-gen-start
          python3 tests/ai_hooks/scan_coverage_gaps.py \
            --since "24 hours ago" \
            --repo . \
            --output /tmp/coverage-gaps.md
          if [ -f /tmp/coverage-gaps.md ]; then
            echo "gaps_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "gaps_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no gaps
        if: steps.scan.outputs.gaps_found != 'true'
        run: |
          echo "No coverage gaps detected. Skipping AI test generation."

      - name: Idempotency check (skip if today's branch already exists)
        if: steps.scan.outputs.gaps_found == 'true'
        id: idempotency
        run: |
          TODAY=$(date -u +%Y%m%d)
          EXISTING=$(git ls-remote --heads origin "refs/heads/ai-tests/${TODAY}-*" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "Branch for today already exists — skipping"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble agy prompt
        if: steps.scan.outputs.gaps_found == 'true' && steps.idempotency.outputs.already_ran != 'true'
        run: |
          python3 - << 'PYEOF'
          import pathlib
          template = pathlib.Path("tests/ai_hooks/prompts/test_gen.md").read_text()
          gaps = pathlib.Path("/tmp/coverage-gaps.md").read_text()
          prompt = template.replace("{COVERAGE_GAPS_CONTENT}", gaps)
          pathlib.Path("/tmp/test-gen-prompt.md").write_text(prompt)
          print(f"Prompt assembled: {len(prompt)} chars")
          PYEOF

      - name: Invoke agy to generate tests
        if: steps.scan.outputs.gaps_found == 'true' && steps.idempotency.outputs.already_ran != 'true'
        timeout-minutes: 8
        run: |
          mkdir -p tests/ai_generated
          # Reference timestamp: files created by agy will be newer than this.
          touch /tmp/agy-gen-start
          # Clear brain to avoid cross-session directory contamination from
          # interactive agy sessions on the same VPS user account.
          rm -rf ~/.gemini/antigravity-cli/brain/ 2>/dev/null || true
          /home/arthur/.local/bin/agy \
            --add-dir tests/ai_generated/ \
            --dangerously-skip-permissions \
            -p "$(cat /tmp/test-gen-prompt.md)"

      - name: Collect agy output from real repo
        if: steps.scan.outputs.gaps_found == 'true' && steps.idempotency.outputs.already_ran != 'true'
        run: |
          # agy writes to the real repo path on this VPS, not the CI checkout.
          # Copy any newly-generated test files into the checkout so subsequent
          # steps can find them.
          REAL_DIR="/home/arthur/repositories/arthurs-blog/tests/ai_generated"
          mkdir -p tests/ai_generated
          if [ -d "$REAL_DIR" ]; then
            find "$REAL_DIR" -maxdepth 1 -name "test_*.py" -newer /tmp/agy-gen-start \
              -exec cp -v {} tests/ai_generated/ \; 2>/dev/null || true
          fi
          COUNT=$(find tests/ai_generated -maxdepth 1 -name "test_*.py" -newer /tmp/agy-gen-start 2>/dev/null | wc -l | tr -d ' ')
          echo "Collected ${COUNT} new test file(s) from real repo into CI checkout"

      - name: Validate — syntax check
        if: steps.scan.outputs.gaps_found == 'true' && steps.idempotency.outputs.already_ran != 'true'
        id: validate_syntax
        run: |
          GENERATED=$(find tests/ai_generated -name "test_*.py" -newer /tmp/agy-gen-start 2>/dev/null)
          if [ -z "$GENERATED" ]; then
            echo "No new test files generated — skipping PR creation"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FAILED=0
          for f in $GENERATED; do
            python3 -m py_compile "$f" || { echo "Syntax error in $f"; FAILED=1; }
          done
          [ "$FAILED" -eq 0 ] \
            && echo "valid=true" >> "$GITHUB_OUTPUT" \
            || echo "valid=false" >> "$GITHUB_OUTPUT"

      - name: Validate — pytest collection check
        if: steps.validate_syntax.outputs.valid == 'true'
        id: validate_collect
        run: |
          if pytest tests/ai_generated/ --collect-only -q 2>&1; then
            echo "collected=true" >> "$GITHUB_OUTPUT"
          else
            echo "collected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and open PR
        if: steps.validate_syntax.outputs.valid == 'true' && steps.validate_collect.outputs.collected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="ai-tests/${TODAY}-${SHORT_SHA}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/ai_generated/
          git commit -m "test(ai-gen): add AI-generated tests for coverage gaps [${TODAY}]

          Co-Authored-By: agy <noreply@anthropic.com>"

          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "test(ai-gen): AI-generated tests for coverage gaps [${TODAY}]" \
            --body-file tests/ai_hooks/pr_body_template.md \
            --base main \
            --head "$BRANCH")

          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Notify via ntfy
        if: env.PR_URL != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg url "$PR_URL" \
              '{
                topic: "watchtower-arthur71684",
                title: "🤖 AI Test Gen PR Ready",
                message: ("新 AI 生成测试 PR，请审核: " + $url),
                tags: ["test_tube"],
                priority: 2,
                click: $url
              }')" \
            https://arthurlovegrace.top/ntfy-push

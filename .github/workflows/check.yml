name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run check
        run: npm run check
        env:
          # 让 tsc 和 next lint 能跑起来，填假值即可（不会真正连接服务）
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Check if app code changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- . \
            ':!.github' ':!supabase' ':!scripts' ':!.agents' ':!.claude' \
            ':!docs' ':!workers' ':!tmp' ':!scratch' ':!**.md')
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.changed == 'true'
        run: curl --fail -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

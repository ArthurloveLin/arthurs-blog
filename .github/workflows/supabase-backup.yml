name: Supabase Daily Backup to R2

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 08:00 执行 (00:00 UTC)
  workflow_dispatch: # 支持手动触发全量备份

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Supabase Database
        run: |
          # 建立数据库连接 URL
          DB_URL="postgresql://postgres.${{ secrets.SUPABASE_PROJECT_ID }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ secrets.SUPABASE_DB_HOST }}:5432/postgres"
          
          echo "Dumping rolls..."
          supabase db dump --db-url "$DB_URL" --role-only --file roles.sql
          
          echo "Dumping schema..."
          supabase db dump --db-url "$DB_URL" --file schema.sql
          
          echo "Dumping data..."
          supabase db dump --db-url "$DB_URL" --data-only --use-copy --file data.sql
          
          echo "Merging into full_backup.sql..."
          # 禁用约束检查以便顺利导入数据，设置顺序：角色 -> 结构 -> 数据
          echo "SET session_replication_role = replica;" > full_backup.sql
          cat roles.sql schema.sql data.sql >> full_backup.sql
          echo "SET session_replication_role = DEFAULT;" >> full_backup.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Compress backup
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          mv full_backup.sql "supabase_full_backup_${TIMESTAMP}.sql"
          gzip "supabase_full_backup_${TIMESTAMP}.sql"
          echo "BACKUP_FILE=supabase_full_backup_${TIMESTAMP}.sql.gz" >> $GITHUB_ENV

      - name: Upload to Cloudflare R2
        run: |
          aws s3 cp "${{ env.BACKUP_FILE }}" "s3://supabase-backups/${{ env.BACKUP_FILE }}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

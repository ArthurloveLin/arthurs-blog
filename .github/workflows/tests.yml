name: Automated Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - '.claude/**'
      - 'tmp/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'MD/**'
      - '**/*.md'
      - '.claude/**'
      - 'tmp/**'
  schedule:
    - cron: '0 2 * * *'   # Nightly at 02:00 UTC (10:00 CST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─── Job 1: Start test container on VPS ───────────────────────────────────────
jobs:
  setup:
    name: Start Test Container
    runs-on: [self-hosted, linux, vps]
    outputs:
      container_ready: ${{ steps.health.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest image
        run: docker pull ghcr.io/arthurlovelin/arthurs-blog:latest

      - name: Stop any existing test container
        run: docker compose -f tests/docker-compose.test.yml down --remove-orphans 2>/dev/null || true

      - name: Start test container
        run: docker compose -f tests/docker-compose.test.yml up -d

      - name: Wait for health check
        id: health
        run: |
          for i in $(seq 1 18); do
            if curl -sf http://localhost:3020/api/blog/search?q=test -o /dev/null; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "✅ Test container healthy after ${i}0s"
              exit 0
            fi
            echo "⏳ Waiting for container... attempt $i/18"
            sleep 10
          done
          echo "❌ Container failed to become healthy"
          docker logs arthurs-blog-test --tail 50
          exit 1

# ─── Job 2: API Integration Tests ─────────────────────────────────────────────
  api-tests:
    name: API Integration Tests (pytest)
    needs: setup
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Run API tests
        env:
          TEST_BASE_URL: http://localhost:3020
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/api/ -v \
            --alluredir=allure-results/api \
            --json-report \
            --json-report-file=tests/ai_hooks/report.json \
            --timeout=30 \
            -m "not slow"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-${{ github.run_number }}
          path: allure-results/api/

      - name: Upload JSON report (for AI analysis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: json-report-${{ github.run_number }}
          path: tests/ai_hooks/report.json

# ─── Job 3: Docker Infrastructure Tests ───────────────────────────────────────
  infra-tests:
    name: Docker Infra Tests (testinfra)
    needs: setup
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Run infrastructure tests
        run: |
          pytest tests/infra/ -v \
            --hosts=docker://arthurs-blog-test \
            --alluredir=allure-results/infra \
            --timeout=30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-infra-${{ github.run_number }}
          path: allure-results/infra/

# ─── Job 4: E2E Tests (Playwright) ────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    needs: api-tests
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          TEST_BASE_URL: http://localhost:3020
        run: |
          pytest tests/e2e/ -v \
            --alluredir=allure-results/e2e \
            --timeout=60 \
            --browser=chromium \
            --headed=false

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e-${{ github.run_number }}
          path: allure-results/e2e/

# ─── Job 5: Performance Tests (Locust) — cloud runner ─────────────────────────
  perf-tests:
    name: Performance Tests (Locust)
    needs: api-tests
    runs-on: ubuntu-latest    # GitHub cloud runner — avoids VPS CPU contention
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Run Locust performance smoke test
        env:
          PERF_TARGET_HOST: ${{ vars.TEST_SITE_URL || 'https://test.arthurlovegrace.top' }}
        run: |
          locust -f tests/perf/locustfile.py \
            --headless \
            -u 20 -r 2 \
            --run-time 60s \
            --host "$PERF_TARGET_HOST" \
            --csv tests/perf/results \
            --exit-code-on-error 1 \
            --html tests/perf/report.html

      - name: Check performance thresholds
        if: always()
        run: python tests/perf/thresholds.py --csv tests/perf/results_stats.csv

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.run_number }}
          path: |
            tests/perf/results*.csv
            tests/perf/report.html

# ─── Job 6: Teardown ──────────────────────────────────────────────────────────
  teardown:
    name: Stop Test Container
    needs: [api-tests, infra-tests, e2e-tests, perf-tests]
    runs-on: [self-hosted, linux, vps]
    if: always()    # Run even if tests fail
    steps:
      - uses: actions/checkout@v4

      - name: Stop test container
        run: docker compose -f tests/docker-compose.test.yml down --remove-orphans

# ─── Job 7: Notify ────────────────────────────────────────────────────────────
  notify:
    name: Send Notification
    needs: [api-tests, infra-tests, e2e-tests, perf-tests]
    runs-on: [self-hosted, linux, vps]
    if: always()
    steps:
      - name: Notify success
        if: ${{ needs.api-tests.result == 'success' && needs.infra-tests.result == 'success' }}
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha "${{ github.sha }}" \
              --arg branch "${{ github.ref_name }}" \
              '{title: "✅ Tests Passed", message: ("Branch: \($branch)\nCommit: \($sha[:7])"), tags: ["white_check_mark"], priority: 2}')" \
            https://arthurlovegrace.top/ntfy-push

      - name: Notify failure
        if: ${{ needs.api-tests.result == 'failure' || needs.infra-tests.result == 'failure' || needs.e2e-tests.result == 'failure' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED=""
          [ "${{ needs.api-tests.result }}" = "failure" ] && FAILED="$FAILED API"
          [ "${{ needs.infra-tests.result }}" = "failure" ] && FAILED="$FAILED Infra"
          [ "${{ needs.e2e-tests.result }}" = "failure" ] && FAILED="$FAILED E2E"
          [ "${{ needs.perf-tests.result }}" = "failure" ] && FAILED="$FAILED Perf"
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg failed "$FAILED" \
              --arg url "$RUN_URL" \
              '{title: "❌ Tests Failed", message: ("Failed:\($failed)\n\($url)"), tags: ["x","rotating_light"], priority: 4}')" \
            https://arthurlovegrace.top/ntfy-push

# ─── Job 8: AI Failure Analysis ────────────────────────────────────────────────
  ai-analysis:
    name: AI Failure Analysis
    needs: [api-tests, infra-tests]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Download JSON report
        uses: actions/download-artifact@v4
        with:
          name: json-report-${{ github.run_number }}
          path: tests/ai_hooks/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format failure report
        run: |
          python tests/ai_hooks/format_report.py \
            --input tests/ai_hooks/report.json \
            --output /tmp/failure-context.md
          echo "=== Failure Context ==="
          cat /tmp/failure-context.md

      # ── Wire up your AI agent here ──────────────────────────────────────────
      # Option A: Antigravity CLI
      # - name: Run Antigravity analysis
      #   run: antigravity run --input /tmp/failure-context.md --output /tmp/analysis.md
      #
      # Option B: Claude Code
      # - name: Run Claude analysis
      #   run: |
      #     claude --print "Analyze these test failures:\n$(cat /tmp/failure-context.md)" \
      #       > /tmp/analysis.md
      # ────────────────────────────────────────────────────────────────────────

      - name: Send failure context to ntfy
        run: |
          PREVIEW=$(head -c 1500 /tmp/failure-context.md)
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg msg "$PREVIEW" \
              '{title: "🤖 AI Failure Context", message: $msg, tags: ["mag"], priority: 3}')" \
            https://arthurlovegrace.top/ntfy-push
